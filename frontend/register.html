<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="/static/css/style.css">
    <title>Register - EzParking</title>
</head>
<body>

    <header class="header">
                <a href="/" class = "title-link"><h1>EzParking <span class="subtitle">/ Register</span></h1></a>
    </header>

    <div class = "form-container">
        <form id="registerForm">
            <div class="input-group">
                <label for="username">Username:</label><br>
                <input type="text" id="username" name="username" required><br><br>

                <label for="email">Email:</label><br>
                <input type="text" id="email" name="email" required><br><br>

                <label for="password">Password:</label><br>
                <input type="password" id="password" name="password" required><br><br>

                <label for="password2">Password Again:</label><br>
                <input type="password" id="password2" name="password2" required><br><br>

                <p id="errorMsg"></p>
                <div class = "center-buttons">
                <button type="submit">Register</button></div>
            </div>
        </form>
    </div>
</body>
</html>

<script>
   fetch("/me", { credentials: "include" })
      .then(res => {
        if (!res.ok) throw new Error();
        return res.json();
      })
      .then(data => {
        console.log("Logged in: " + data.user_id);
      })
      .catch((err ) => {
        console.log("Not logged in.");
      });
</script>

<script src="/static/js/register.js" defer></script>
<script src="/static/js/showToast.js" defer></script>
